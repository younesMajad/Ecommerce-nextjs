<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background:#0a0f1d; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="1"/>
    </radialGradient>

    <!-- Card Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Line Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients for Nodes -->
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="server-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="supabase-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Connectors Gradient -->
    <linearGradient id="conn-client-server" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="conn-server-db" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background Glow -->
  <rect width="900" height="500" fill="url(#bg-glow)"/>

  <!-- GRID PATTERN -->
  <g opacity="0.05">
    <path d="M 0,50 L 900,50 M 0,100 L 900,100 M 0,150 L 900,150 M 0,200 L 900,200 M 0,250 L 900,250 M 0,300 L 900,300 M 0,350 L 900,350 M 0,400 L 900,400 M 0,450 L 900,450" stroke="#ffffff" stroke-width="1"/>
    <path d="M 50,0 L 50,500 M 100,0 L 100,500 M 150,0 L 150,500 M 200,0 L 200,500 M 250,0 L 250,500 M 300,0 L 300,500 M 350,0 L 350,500 M 400,0 L 400,500 M 450,0 L 450,500 M 500,0 L 500,500 M 550,0 L 550,500 M 600,0 L 600,500 M 650,0 L 650,500 M 700,0 L 700,500 M 750,0 L 750,500 M 800,0 L 800,500 M 850,0 L 850,500" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- TITLE -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="1">PROJECT SYSTEM ARCHITECTURE</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Next.js 16 (App Router) &amp; Supabase Full-Stack Architecture</text>

  <!-- ==================== CONNECTIONS / FLOWS ==================== -->
  
  <!-- Client to Server -->
  <path d="M 290,180 H 350" stroke="url(#conn-client-server)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <path d="M 290,280 H 350" stroke="url(#conn-client-server)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <path d="M 290,380 H 350" stroke="url(#conn-client-server)" stroke-width="4" fill="none" filter="url(#glow)"/>

  <!-- Server to Supabase -->
  <path d="M 550,180 H 610" stroke="url(#conn-server-db)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <path d="M 550,280 H 610" stroke="url(#conn-server-db)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <path d="M 550,380 H 610" stroke="url(#conn-server-db)" stroke-width="4" fill="none" filter="url(#glow)"/>

  <!-- Arrowheads -->
  <!-- Client to Server -->
  <polygon points="352,180 344,175 344,185" fill="#2563eb"/>
  <polygon points="352,280 344,275 344,285" fill="#2563eb"/>
  <polygon points="352,380 344,375 344,385" fill="#2563eb"/>
  <!-- Server to Supabase -->
  <polygon points="612,180 604,175 604,185" fill="#10b981"/>
  <polygon points="612,280 604,275 604,285" fill="#10b981"/>
  <polygon points="612,380 604,375 604,385" fill="#10b981"/>

  <!-- ==================== 1. CLIENT CONTAINER (LEFT) ==================== -->
  <g filter="url(#shadow)">
    <!-- Container Card -->
    <rect x="50" y="100" width="240" height="340" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="50" y="100" width="240" height="50" rx="16" fill="url(#client-grad)" opacity="0.85" clip-path="inset(0px 0px 290px 0px)"/>
    <text x="170" y="132" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">1. Client Storefront</text>

    <!-- Sub-items inside Client -->
    <!-- React 19 UI -->
    <g transform="translate(65, 160)">
      <rect width="210" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="25" cy="24" r="10" fill="#61dafb" opacity="0.2"/>
      <text x="25" y="28" fill="#61dafb" font-size="12" font-weight="bold" text-anchor="middle">⚛</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="bold">React 19 Components</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">Dynamic, Interactive views</text>
    </g>

    <!-- Zustand State -->
    <g transform="translate(65, 250)">
      <rect width="210" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="25" cy="24" r="10" fill="#fbbf24" opacity="0.2"/>
      <text x="25" y="28" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">🐻</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="bold">Zustand Cart State</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">Persisted LocalStorage Basket</text>
    </g>

    <!-- Tailwind v4 -->
    <g transform="translate(65, 340)">
      <rect width="210" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="25" cy="24" r="10" fill="#38bdf8" opacity="0.2"/>
      <text x="25" y="28" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">⚡</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="bold">Tailwind CSS v4</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">Modern responsive UI layout</text>
    </g>
  </g>

  <!-- ==================== 2. SERVER LAYER (CENTER) ==================== -->
  <g filter="url(#shadow)">
    <!-- Container Card -->
    <rect x="350" y="100" width="240" height="340" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="350" y="100" width="240" height="50" rx="16" fill="url(#server-grad)" opacity="0.85" clip-path="inset(0px 0px 290px 0px)"/>
    <text x="470" y="132" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">2. Next.js Server (APIs)</text>

    <!-- Middleware Router -->
    <g transform="translate(365, 160)">
      <rect width="210" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="25" cy="24" r="10" fill="#818cf8" opacity="0.2"/>
      <text x="25" y="28" fill="#818cf8" font-size="11" font-weight="bold" text-anchor="middle">🛡️</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="bold">SSR Session Middleware</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">Route Guarding &amp; Auth Checks</text>
    </g>

    <!-- Server Actions -->
    <g transform="translate(365, 250)">
      <rect width="210" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="25" cy="24" r="10" fill="#c084fc" opacity="0.2"/>
      <text x="25" y="28" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">⚙</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="bold">Server Actions</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">Order placement &amp; user actions</text>
    </g>

    <!-- API Routes -->
    <g transform="translate(365, 340)">
      <rect width="210" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="25" cy="24" r="10" fill="#f43f5e" opacity="0.2"/>
      <text x="25" y="28" fill="#f43f5e" font-size="10" font-weight="bold" text-anchor="middle">🔗</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="bold">API Routes (/api/*)</text>
      <text x="50" y="38" fill="#94a3b8" font-size="10">JSON endpoints for catalog/reviews</text>
    </g>
  </g>

  <!-- ==================== 3. BACKEND CONTAINER (RIGHT) ==================== -->
  <g filter="url(#shadow)">
    <!-- Container Card -->
    <rect x="610" y="100" width="240" height="340" rx="16" fill="#061e16" stroke="#065f46" stroke-width="2"/>
    <rect x="610" y="100" width="240" height="50" rx="16" fill="url(#supabase-grad)" opacity="0.85" clip-path="inset(0px 0px 290px 0px)"/>
    <text x="730" y="132" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">3. Supabase Cloud</text>

    <!-- Supabase Auth -->
    <g transform="translate(625, 160)">
      <rect width="210" height="48" rx="8" fill="#072d22" stroke="#047857" stroke-width="1.5"/>
      <circle cx="25" cy="24" r="10" fill="#10b981" opacity="0.2"/>
      <text x="25" y="28" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">🔑</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="bold">Supabase Auth &amp; SSR</text>
      <text x="50" y="38" fill="#34d399" font-size="10">Emails, Magic Link, Google OAuth</text>
    </g>

    <!-- PostgreSQL DB -->
    <g transform="translate(625, 250)">
      <rect width="210" height="48" rx="8" fill="#072d22" stroke="#047857" stroke-width="1.5"/>
      <circle cx="25" cy="24" r="10" fill="#10b981" opacity="0.2"/>
      <text x="25" y="28" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">💾</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="bold">PostgreSQL Database</text>
      <text x="50" y="38" fill="#34d399" font-size="10">Products, Orders, Profiles data</text>
    </g>

    <!-- Security & Triggers -->
    <g transform="translate(625, 340)">
      <rect width="210" height="48" rx="8" fill="#072d22" stroke="#047857" stroke-width="1.5"/>
      <circle cx="25" cy="24" r="10" fill="#10b981" opacity="0.2"/>
      <text x="25" y="28" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">🛡</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="bold">RLS &amp; Database Triggers</text>
      <text x="50" y="38" fill="#34d399" font-size="10">Row-Level security, auto profiles</text>
    </g>
  </g>

  <!-- Explanatory Footnote -->
  <text x="450" y="475" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">✨ Standard modern stack with robust client-server-database lifecycle isolation.</text>
</svg>
